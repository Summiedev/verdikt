spring:
  datasource:
    url: jdbc:h2:mem:verdikt;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379
app:
  allowed-origins: http://localhost:5173
  token:
    secret: test-only-token-secret-that-is-long-enough
logging:
  level:
    root: WARN
    com.verdikt: INFO
