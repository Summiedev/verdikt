spring:
  application:
    name: verdikt-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_MAX_SIZE:25}
      minimum-idle: ${SPRING_DATASOURCE_POOL_MIN_IDLE:5}
      idle-timeout: 600000
      max-lifetime: 1200000
      connection-timeout: 10000
      validation-timeout: 5000
  jpa:
    defer-datasource-initialization: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        default_schema: public
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  sql:
    init:
      mode: never
  data:
    redis:
      connect-timeout: 2000
      timeout: 2000
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 1000ms
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "verdikt:"

server:
  shutdown: graceful
  tomcat:
    max-swallow-size: 2MB
    threads:
      max: 200
      min-spare: 10
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring.lifecycle:
  timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,websocketBroker
  metrics:
    enable:
      http.server.requests: true
      jvm.memory: true
      process.cpu: true
      system.cpu: true
      cache: true
      jdbc: true
    export:
      prometheus:
        enabled: true

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS}
  token:
    secret: ${APP_TOKEN_SECRET}
  rate-limit:
    room-creation-ttl-minutes: 120
    vote-ttl-minutes: 5
    global-capacity: 200
    global-refill-period: 1
  websocket:
    max-text-message-size: 65536
    max-binary-message-size: 65536
    send-timeout: 5000

logging:
  level:
    root: INFO
    com.verdikt: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.springframework.cache: WARN
    org.springframework.data.redis: WARN
    org.springframework.messaging: WARN
    org.springframework.scheduling: INFO
    org.springframework.transaction: WARN
    io.lettuce: WARN
    com.zaxxer.hikari: INFO
    org.postgresql: WARN
