spring:
  application:
    name: verdikt-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/verdikt?useTimezone=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:summie}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_MAX_SIZE:25}
      minimum-idle: ${SPRING_DATASOURCE_POOL_MIN_IDLE:5}
      idle-timeout: 600000
      max-lifetime: 1200000
      connection-timeout: 10000
      validation-timeout: 5000
      leak-detection-threshold: 30000

  sql:
    init:
      mode: always

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${APP_FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  data:
    redis:
      connect-timeout: 2000
      timeout: 2000
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 1000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "verdikt:"

management:
  metrics:
    enable:
      http:
        server:
          requests: true
      jvm:
        memory: true
      process:
        cpu: true
      system:
        cpu: true
      web:
        sessions: true
    export:
      prometheus:
        enabled: true

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://verdikt.online,https://www.verdikt.online}
  rate-limit:
    room-creation-ttl-minutes: 120
    vote-ttl-minutes: 5

logging:
  level:
    root: INFO
    com.verdikt: DEBUG
    org.springframework.web: DEBUG