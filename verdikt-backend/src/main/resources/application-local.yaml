spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/verdikt?useTimezone=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:summie}
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  token:
    secret: ${APP_TOKEN_SECRET:local-only-token-secret}
logging:
  level:
    root: INFO
    com.verdikt: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
