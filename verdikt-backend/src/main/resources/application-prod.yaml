spring:
  config:
    activate:
      on-profile: prod
  # Player tokens are the application's only runtime authentication mechanism.
  # Do not let Spring Boot create a temporary development user/password in production.
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
app:
  allowed-origins: ${APP_ALLOWED_ORIGINS}
  token:
    secret: ${APP_TOKEN_SECRET}
