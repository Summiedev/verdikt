spring:
  application:
    name: verdikt-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/verdikt?useTimezone=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:summie}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_POOL_MAX_SIZE:25}
      minimum-idle: ${SPRING_DATASOURCE_POOL_MIN_IDLE:5}
      idle-timeout: 600000
      max-lifetime: 1200000
      connection-timeout: 10000
      validation-timeout: 5000
      leak-detection-threshold: 30000

  jpa:
    defer-datasource-initialization: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          time_zone: UTC
        default_schema: public
    show-sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  sql:
    init:
      mode: never

  data:
    redis:
      connect-timeout: 2000
      timeout: 2000
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 1000ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false
      use-key-prefix: true
      key-prefix: "verdikt:"

server:
  shutdown: graceful
  tomcat:
    max-swallow-size: -1
    threads:
      max: 200
      min-spare: 10
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,caches,flyway
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis,websocketBroker
  metrics:
    enable:
      http:
        server:
          requests: true
      jvm:
        memory: true
      process:
        cpu: true
      system:
        cpu: true
      web:
        sessions: true
      cache: true
      jdbc: true
    export:
      prometheus:
        enabled: true

app:
  allowed-origins: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://verdikt.online,https://www.verdikt.online}
  token:
    secret: ${APP_TOKEN_SECRET:change-me-in-production-use-a-real-secret}
  rate-limit:
    room-creation-ttl-minutes: 120
    vote-ttl-minutes: 5
    global-capacity: 200
    global-refill-rate: 200
    global-refill-period: 1
  websocket:
    max-text-message-size: 65536
    max-binary-message-size: 65536
    send-timeout: 5000

logging:
  level:
    root: INFO
    com.verdikt: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.springframework.cache: INFO
    org.springframework.data.redis: INFO
    org.springframework.messaging: INFO
    org.springframework.scheduling: INFO
    org.springframework.transaction: INFO
    io.lettuce: WARN
    com.zaxxer.hikari: INFO
    org.postgresql: WARN

---
spring:
  config:
    activate:
      on-profile: local
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
logging:
  level:
    root: INFO
    com.verdikt: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG