name: Verdikt CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verdikt-production
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: verdikt-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: verdikt-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: verdikt
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password-1234
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d verdikt"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/verdikt
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ci-password-1234
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_REDIS_HOST: localhost
      APP_ALLOWED_ORIGINS: http://localhost:5173
      APP_TOKEN_SECRET: ci-only-token-secret-that-is-long-enough
    defaults:
      run:
        working-directory: verdikt-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://verdikt.online
    timeout-minutes: 20
    steps:
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          known_hosts="$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | tr -d '\r')"
          if [[ "$known_hosts" =~ ^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp[0-9]+)[[:space:]] ]]; then
            printf '%s %s\n' "$DEPLOY_HOST" "$known_hosts" > ~/.ssh/known_hosts
          else
            printf '%s\n' "$known_hosts" > ~/.ssh/known_hosts
          fi
          if ! ssh-keygen -F "$DEPLOY_HOST" -f ~/.ssh/known_hosts >/dev/null; then
            echo "::error::DEPLOY_KNOWN_HOSTS must be either a complete known_hosts line or the raw contents of ssh_host_ed25519_key.pub for DEPLOY_HOST."
            exit 1
          fi
      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [[ -z "$DEPLOY_HOST" || "$DEPLOY_HOST" =~ [[:space:]] ]]; then
            echo "::error::DEPLOY_HOST must be a hostname or IP without spaces."
            exit 1
          fi
          if [[ -z "$DEPLOY_USER" || ! "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::DEPLOY_USER must be the raw Linux username, for example ubuntu. Do not include DEPLOY_USER=, a path, quotes, or spaces."
            exit 1
          fi
          if [[ -z "$DEPLOY_PATH" || "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" =~ $'\n' || "$DEPLOY_PATH" =~ $'\r' ]]; then
            echo "::error::DEPLOY_PATH must be an absolute VPS path, for example /home/ubuntu/verdikt."
            exit 1
          fi
      - name: Pull and restart Docker stack
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu;
             cd '$DEPLOY_PATH';
             git pull --ff-only origin main;
             docker compose up -d --build --remove-orphans --wait --wait-timeout 180 ||
             { docker compose ps -a;
               for container in verdikt-backend verdikt-frontend; do
                 if docker inspect "$container" >/dev/null 2>&1; then
                   docker inspect --format='{{.Name}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container";
                   docker inspect --format='{{if .State.Health}}{{range .State.Health.Log}}{{printf "health exit=%d output=%s\n" .ExitCode .Output}}{{end}}{{end}}' "$container";
                 fi;
               done;
               docker compose logs --tail=200 backend frontend;
               exit 1; };
             docker compose ps;
             docker system df"
      - name: Verify production
        run: curl --fail --silent --show-error --location --max-time 15 --retry 20 --retry-all-errors --retry-delay 5 https://verdikt.online/
